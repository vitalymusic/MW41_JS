<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karuselis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        .vk-carousel{
            max-width:1200px;
            margin: 0 auto;
        }
        .slide{
            display: none;
        }
        .active-slide{
            display: block;
            animation:swing-in-right-bck .6s cubic-bezier(.175,.885,.32,1.275) both
        }


        .buttons{
            display: flex;
            justify-content: space-between;
            padding:0 10px;
            position: relative;
            top:calc(324px / 2 - 324px);
        }

        .buttons button{
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            /* padding: 5px; */
            background: rgba(255, 255, 255, 0.607);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;

            &:hover{
                background: rgba(255, 255, 255, 1);
                transition: 0.4s;
            }

        }


        .swing-in-right-bck{}

        @keyframes swing-in-right-bck{0%{transform:rotateY(70deg);transform-origin:right;opacity:0}100%{transform:rotateY(0);transform-origin:right;opacity:1}}
    </style>
</head>
<body>
    <div class="vk-carousel">
        <div class="slides">
            <div class="slide active-slide"><img src="https://picsum.photos/id/5/1200/300" alt="bilde"></div>
            <div class="slide"><img src="https://picsum.photos/id/7/1200/300" alt="bilde"></div>
            <div class="slide"><img src="https://picsum.photos/id/9/1200/300" alt="bilde"></div>
        </div>
        <div class="buttons">
            <button><i class="fa-solid fa-angle-left"></i></button>
            <button><i class="fa-solid fa-angle-right"></i></button>
        </div>
        <div class="dots"></div>

    </div>



    <script>
        let carouselDiv = document.querySelector('.vk-carousel');
        let slides = carouselDiv.querySelectorAll('.slide');
        let buttons = carouselDiv.querySelectorAll('.buttons button');
        let currSlide = 0;

        function showSlide(slideNumber){
            for(slide of slides){
                slide.classList.remove('active-slide');
            }
            slides[slideNumber].classList.add('active-slide');
        }
        showSlide(currSlide);


        function nextSlide(){
            currSlide++;
            if(currSlide > slides.length-1){
                currSlide = 0
            }

            showSlide(currSlide);
            console.log(currSlide)

        }


        function prevSlide(){
            currSlide--;
            if(currSlide < 0 ){
                currSlide = slides.length-1
            }
            
            showSlide(currSlide);
            console.log(currSlide)

        }

        buttons[0].onclick = prevSlide;
        buttons[1].onclick = nextSlide;





        // console.log(slides,buttons);

    </script>
</body>
</html>
