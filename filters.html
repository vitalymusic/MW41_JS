<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartiņu filtrs</title>

    <style>
        .filter_buttons{
            display: flex;
            justify-content: center;
            gap:20px;
        }

        .filter_cards{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap:20px;
            width:75%;
            margin: 20px auto;

        }


         .filter_cards .card{
            width:300px;
            height: 300px;
            border:1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
         }


         .card[data-cat="html"]{background: rgb(200, 255, 0);}
         .card[data-cat="css"]{background: rgb(0, 162, 255)}
         .card[data-cat="js"]{background: rgb(251, 79, 249);}

    </style>
</head>
<body>
    <div class="filter">
        <div class="filter_buttons">
            <button data-cat="all">Visas kategorijas</button>
            <button data-cat="html">HTML</button>
            <button data-cat="css">CSS</button>
            <button data-cat="js">Javascript</button>
        </div>
        <div class="filter_cards">
            
            <div class="card" data-cat="html">
                <h1>HTML2</h1>
            </div>
             <div class="card" data-cat="js">
                <h1>JacaScript2</h1>
            </div>
            <div class="card" data-cat="html">
                <h1>HTML3</h1>
            </div>
             <div class="card" data-cat="css">
                <h1>CSS1</h1>
            </div>
            <div class="card" data-cat="html">
                <h1>HTML1</h1>
            </div>
             <div class="card" data-cat="css">
                <h1>CSS2</h1>
            </div>
             
             <div class="card" data-cat="js">
                <h1>JacaScript3</h1>
            </div>
            <div class="card" data-cat="css">
                <h1>CSS3</h1>
            </div>
            <div class="card" data-cat="js">
                <h1>JacaScript1</h1>
            </div>
           
           

        </div>

    </div>


    <div class="mobile_nav">
        <button>Close</button>

        <a href="">Par mums</a>
        <a href="">Pakalpojumi</a>
        <a href="">Cenas</a>
        <a href="">Kontakti</a>

    </div>


    <script>
        let filter_buttons = document.querySelectorAll('.filter_buttons button');


        let filter_cards = document.querySelectorAll('.filter_cards .card');

        for(button of filter_buttons){
            button.onclick = (e)=>{
                  filterItems(e.target.dataset.cat)  
            }

        }

        function filterItems(category){
            console.log(category);

            for(card of filter_cards){
                if(category=="all"){
                     card.style.display="flex"
                }else if(card.dataset.cat==category){
                        card.style.display="flex"
                }else{
                    card.style.display="none"
                }

            }
        }



    </script>
</body>
</html>
